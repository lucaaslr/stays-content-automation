<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Stays.net - Configuração do Imóvel AB25I</title>
  <script>
    window.__SESSION_TOKEN__ = "secret-session-jwt-token-999";
  </script>
</head>
<body>
  <header>
    <h1>Imóvel AB25I - Cabana Vista da Serra</h1>
    <input type="hidden" name="csrf_token" value="csrf-secret-value-12345" />
    <input type="password" name="admin_password" value="SuperSecretAdminPass" />
  </header>

  <nav>
    <button role="tab" data-section="descriptive-content">Conteúdo descritivo</button>
  </nav>

  <main id="main-content">
    <section id="custom-fields" data-section="custom-fields">
      <h2>Campos personalizados</h2>

      <div class="form-group">
        <label for="cf_post_booking">Esteja Ciente (Pós reserva)</label>
        <textarea id="cf_post_booking" name="cf_post_booking" data-testid="field-post_booking_notice"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_address">Endereço da Propriedade</label>
        <textarea id="cf_address" name="cf_address" data-testid="field-property_address">Endereço Antigo Diferente, 100</textarea>
      </div>

      <div class="form-group">
        <label for="cf_loc_notes">Observação para encontrar o imóvel</label>
        <textarea id="cf_loc_notes" name="cf_loc_notes"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_gmaps">Abrir no Google Maps</label>
        <input type="text" id="cf_gmaps" name="cf_gmaps" value="" />
      </div>

      <div class="form-group">
        <label for="cf_checkin">Instruções para check-in</label>
        <textarea id="cf_checkin" name="cf_checkin"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_reg_instr">Instruções para preenchimento</label>
        <textarea id="cf_reg_instr" name="cf_reg_instr"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_reg_form">Ficha Cadastral</label>
        <input type="text" id="cf_reg_form" name="cf_reg_form" value="" />
      </div>

      <div class="form-group">
        <label for="cf_access">Instruções de Acesso</label>
        <textarea id="cf_access" name="cf_access"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_host">Anfitrião Local</label>
        <textarea id="cf_host" name="cf_host"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_whatsapp">WhatsApp Anfitrião</label>
        <input type="text" id="cf_whatsapp" name="cf_whatsapp" value="" />
      </div>

      <div class="form-group">
        <label for="cf_common">A propriedade, dependências comuns</label>
        <textarea id="cf_common" name="cf_common"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_amenities">Comodidades gerais</label>
        <textarea id="cf_amenities" name="cf_amenities"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_kitchen">Cozinha e churrasqueira</label>
        <textarea id="cf_kitchen" name="cf_kitchen"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_rooms">Quartos, camas e climatização</label>
        <textarea id="cf_rooms" name="cf_rooms"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_safety">Acessibilidade e segurança</label>
        <textarea id="cf_safety" name="cf_safety"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_parking">Estacionamento</label>
        <textarea id="cf_parking" name="cf_parking"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_linen">Rouparia de cama e banho</label>
        <textarea id="cf_linen" name="cf_linen"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_wifi">Wi-fi e dispositivos eletrônicos</label>
        <textarea id="cf_wifi" name="cf_wifi"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_meal">Plano de alimentação</label>
        <textarea id="cf_meal" name="cf_meal"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_damages">Caso de avarias ou infrações</label>
        <textarea id="cf_damages" name="cf_damages"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_trash">Lixo e manutenções</label>
        <textarea id="cf_trash" name="cf_trash"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_emergency">Em caso de emergência</label>
        <textarea id="cf_emergency" name="cf_emergency"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_other">Demais instruções gerais</label>
        <textarea id="cf_other" name="cf_other"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_schedule">Políticas de horários</label>
        <textarea id="cf_schedule" name="cf_schedule"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_pets">Políticas de pets</label>
        <textarea id="cf_pets" name="cf_pets"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_children">Políticas de crianças</label>
        <textarea id="cf_children" name="cf_children"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_extra_guests">Políticas de hóspedes adicionais ou Day Use</label>
        <textarea id="cf_extra_guests" name="cf_extra_guests"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_reg_pol">Políticas de fichas cadastrais</label>
        <textarea id="cf_reg_pol" name="cf_reg_pol"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_mod_pol">Políticas de alteração da reserva</label>
        <textarea id="cf_mod_pol" name="cf_mod_pol"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_cancel_pol">Políticas de cancelamento da reserva</label>
        <textarea id="cf_cancel_pol" name="cf_cancel_pol"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_dot">.</label>
        <textarea id="cf_dot" name="cf_dot"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_penalty_pol">Políticas de avarias e penalidades</label>
        <textarea id="cf_penalty_pol" name="cf_penalty_pol"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_usage_pol">Políticas de utilização geral da unidade</label>
        <textarea id="cf_usage_pol" name="cf_usage_pol"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_checkout">Regras de check-out</label>
        <textarea id="cf_checkout" name="cf_checkout"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_mt_services">Contratação com a Multitemporada - Serviços e experiências</label>
        <textarea id="cf_mt_services" name="cf_mt_services"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_pro_services">Contratação com o PRO - Serviços e experiências</label>
        <textarea id="cf_pro_services" name="cf_pro_services"></textarea>
      </div>

      <div class="form-group">
        <label for="cf_review_link">Link para avaliar a propriedade</label>
        <input type="text" id="cf_review_link" name="cf_review_link" value="" />
      </div>

      <div class="actions">
        <button type="submit" data-testid="save-custom-fields">Salvar</button>
      </div>
    </section>
  </main>
</body>
</html>
