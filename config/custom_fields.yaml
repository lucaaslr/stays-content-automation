schema_version: "1.0"
expected_count: 36
divergence_note: >
  O requisito menciona 36 campos personalizados, porém a especificação oficial lista
  37 entradas distintas (incluindo o campo "." na posição 31). Nenhum campo foi
  excluído silenciosamente; todos os 37 campos são rastreados e auditados.

fields:
  - field_key: "post_booking_notice"
    stays_label: "Esteja Ciente (Pós reserva)"
    description: "informações importantes que o hóspede deve saber após a reserva."
    instructions: "Resuma avisos essenciais pós-reserva confirmados na fonte (ex.: necessidade de envio de documentos, regras críticas de chegada ou taxas obrigatórias informadas)."
    aliases:
      - "Esteja Ciente (Pos reserva)"
      - "Esteja Ciente"
    field_type: "text"
    sensitive: false
    required: false
    max_length: 2000
    enabled: true
    allow_auto_fill: true

  - field_key: "property_address"
    stays_label: "Endereço da Propriedade"
    description: "endereço completo da propriedade."
    instructions: "Informe exclusivamente o endereço físico encontrado na fonte (logradouro, número, complemento, bairro, cidade, UF, CEP). Não invente números ou CEPs ausentes."
    aliases:
      - "Endereco da Propriedade"
      - "Endereço do Imóvel"
    field_type: "text"
    sensitive: false
    required: true
    max_length: 500
    enabled: true
    allow_auto_fill: true

  - field_key: "location_notes"
    stays_label: "Observação para encontrar o imóvel"
    description: "dicas e instruções para localizar o imóvel."
    instructions: "Inclua pontos de referência, orientações de chegada, nome do edifício/condomínio ou instruções de acesso rodoviário presentes na fonte."
    aliases:
      - "Observacao para encontrar o imovel"
      - "Como chegar"
    field_type: "text"
    sensitive: false
    required: false
    max_length: 1500
    enabled: true
    allow_auto_fill: true

  - field_key: "google_maps_url"
    stays_label: "Abrir no Google Maps"
    description: "somente o link completo do Google Maps."
    instructions: "Retorne SOMENTE a URL válida do Google Maps (https://maps.google... ou https://goo.gl/maps/... ou https://maps.app.goo.gl/...). Não adicione nenhum texto antes ou depois."
    aliases:
      - "Link Google Maps"
      - "Google Maps"
    field_type: "url"
    sensitive: false
    required: false
    max_length: 500
    enabled: true
    allow_auto_fill: true

  - field_key: "checkin_instructions"
    stays_label: "Instruções para check-in"
    description: "instruções e regras de check-in, exceto informações sensíveis de self check-in."
    instructions: "Descreva os procedimentos de chegada, recepção ou portaria sem expor senhas de fechaduras ou códigos secretos (que pertencem a Instruções de Acesso)."
    aliases:
      - "Instrucoes para check-in"
      - "Instruções de check-in"
    field_type: "text"
    sensitive: false
    required: true
    max_length: 2000
    enabled: true
    allow_auto_fill: true

  - field_key: "registration_instructions"
    stays_label: "Instruções para preenchimento"
    description: "informações necessárias para o preenchimento da ficha cadastral."
    instructions: "Informe quais dados ou documentos (RG, CPF, placa do veículo, nome completo de todos os hóspedes) são solicitados para preencher a ficha cadastral."
    aliases:
      - "Instrucoes para preenchimento"
      - "Instruções de preenchimento da ficha"
    field_type: "text"
    sensitive: false
    required: false
    max_length: 1500
    enabled: true
    allow_auto_fill: true

  - field_key: "registration_form"
    stays_label: "Ficha Cadastral"
    description: "somente o link da ficha cadastral."
    instructions: "Retorne SOMENTE a URL direta do formulário/ficha cadastral. Não adicione texto explicativo."
    aliases:
      - "Link Ficha Cadastral"
      - "Formulário Cadastral"
    field_type: "url"
    sensitive: false
    required: false
    max_length: 500
    enabled: true
    allow_auto_fill: true

  - field_key: "access_instructions"
    stays_label: "Instruções de Acesso"
    description: "informações sensíveis disponibilizadas apenas no momento adequado, como códigos, senhas ou orientações de acesso."
    instructions: "Registre códigos de cofre/keybox, senhas de fechadura eletrônica, tags ou procedimentos restritos de self check-in encontrados na fonte. Marque sensitive=true."
    aliases:
      - "Instrucoes de Acesso"
      - "Senhas de Acesso"
    field_type: "text"
    sensitive: true
    required: false
    max_length: 1500
    enabled: true
    allow_auto_fill: true

  - field_key: "local_host"
    stays_label: "Anfitrião Local"
    description: "instruções referentes ao responsável operacional do imóvel."
    instructions: "Informe o nome do anfitrião/responsável operacional local, horários de atendimento presencial/remoto e papel no suporte ao hóspede."
    aliases:
      - "Anfitriao Local"
      - "Responsável Local"
    field_type: "text"
    sensitive: false
    required: false
    max_length: 1000
    enabled: true
    allow_auto_fill: true

  - field_key: "host_whatsapp_url"
    stays_label: "WhatsApp Anfitrião"
    description: "link completo do WhatsApp do responsável operacional."
    instructions: "Retorne SOMENTE o link completo do WhatsApp (ex.: https://wa.me/... ou https://api.whatsapp.com/send?phone=...). Não inclua texto adicional."
    aliases:
      - "WhatsApp Anfitriao"
      - "Link WhatsApp Anfitrião"
    field_type: "url"
    sensitive: true
    required: false
    max_length: 500
    enabled: true
    allow_auto_fill: true

  - field_key: "common_areas"
    stays_label: "A propriedade, dependências comuns"
    description: "informações sobre áreas e espaços comuns do condomínio, pousada ou propriedade."
    instructions: "Descreva de forma objetiva as áreas compartilhadas (piscina coletiva, salão de jogos, academia, jardim, portaria, regras de uso das áreas comuns)."
    aliases:
      - "A propriedade, dependencias comuns"
      - "Dependências comuns"
    field_type: "text"
    sensitive: false
    required: false
    max_length: 2500
    enabled: true
    allow_auto_fill: true

  - field_key: "general_amenities"
    stays_label: "Comodidades gerais"
    description: "resumo objetivo das comodidades, sem linguagem promocional excessiva."
    instructions: "Liste as comodidades disponíveis na unidade de maneira direta e factual, eliminando adjetivos publicitários exagerados."
    aliases:
      - "Comodidades"
      - "Itens de comodidade"
    field_type: "text"
    sensitive: false
    required: true
    max_length: 2500
    enabled: true
    allow_auto_fill: true

  - field_key: "kitchen_and_bbq"
    stays_label: "Cozinha e churrasqueira"
    description: "itens disponíveis e respectivas instruções ou limitações de uso."
    instructions: "Relacione eletrodomésticos, utensílios de cozinha, tipo de fogão/forno, presença de churrasqueira (privativa ou coletiva), espetos/grelha e regras de limpeza."
