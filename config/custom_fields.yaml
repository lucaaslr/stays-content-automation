      - "Demais instrucoes gerais"
      - "Outras instruções"
    field_type: "text"
    sensitive: false
    required: false
    max_length: 2000
    enabled: true
    allow_auto_fill: true

  - field_key: "schedule_policies"
    stays_label: "Políticas de horários"
