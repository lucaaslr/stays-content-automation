      - "Cozinha e Churrasqueira"
    field_type: "text"
    sensitive: false
    required: false
    max_length: 2000
    enabled: true
    allow_auto_fill: true

  - field_key: "rooms_beds_climate"
    stays_label: "Quartos, camas e climatização"
    description: "distribuição dos quartos e banheiros, tipos de camas e ambientes climatizados."
    instructions: "Detalhe a quantidade de quartos, suítes e banheiros, configuração exata de camas/colchões em cada cômodo e presença de ar-condicionado, ventilador ou aquecedor."
    aliases:
      - "Quartos, camas e climatizacao"
      - "Configuração dos quartos"
    field_type: "text"
    sensitive: false
    required: true
    max_length: 2500
    enabled: true
    allow_auto_fill: true

  - field_key: "accessibility_and_safety"
    stays_label: "Acessibilidade e segurança"
    description: "andar, elevador ou escada, acesso para cadeirantes, telas de proteção, câmeras externas e outros recursos de segurança."
    instructions: "Informe andar do imóvel, existência de escadas ou elevador, rampas, telas de proteção em janelas/sacadas, câmeras em áreas externas, extintores ou cercas."
    aliases:
      - "Acessibilidade e seguranca"
    field_type: "text"
    sensitive: false
    required: false
    max_length: 2000
    enabled: true
    allow_auto_fill: true

  - field_key: "parking"
