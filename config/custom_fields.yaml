      - "Caso de avarias ou infracoes"
    field_type: "text"
    sensitive: false
    required: false
    max_length: 1500
    enabled: true
    allow_auto_fill: true

  - field_key: "trash_and_maintenance"
    stays_label: "Lixo e manutenções"
    description: "descarte de lixo e funcionamento de serviços de manutenção, piscina, jardim ou similares."
