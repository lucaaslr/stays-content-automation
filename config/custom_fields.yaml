      - "Emergências"
    field_type: "text"
    sensitive: false
    required: false
    max_length: 2000
    enabled: true
    allow_auto_fill: true

  - field_key: "other_general_instructions"
    stays_label: "Demais instruções gerais"
    description: "peculiaridades não contempladas nos outros campos."
    instructions: "Registre particularidades da propriedade (ex.: aquecimento a gás, fossa séptica, pressão da água, uso de lareira, regras específicas locais) que não se encaixem nos demais campos."
