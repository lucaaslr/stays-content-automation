      - "Plano de alimentacao"
      - "Alimentação e café da manhã"
    field_type: "text"
    sensitive: false
    required: false
    max_length: 1200
    enabled: true
    allow_auto_fill: true

  - field_key: "damages_or_infractions"
    stays_label: "Caso de avarias ou infrações"
    description: "procedimento em caso de identificação ou ocorrência de avarias, infrações e mau uso."
    instructions: "Descreva como o hóspede deve comunicar danos pré-existentes na chegada ou avarias acidentais durante a estadia, e o fluxo operacional adotado."
