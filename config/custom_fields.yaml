    instructions: "Especifique número de vagas, se são cobertas ou descobertas, fixas ou rotativas, numeração da vaga, porte máximo de veículo e regras de estacionamento."
    aliases:
      - "Vaga de garagem"
      - "Garagem e estacionamento"
    field_type: "text"
    sensitive: false
    required: false
    max_length: 1500
    enabled: true
    allow_auto_fill: true

  - field_key: "bed_and_bath_linen"
    stays_label: "Rouparia de cama e banho"
    description: "disponibilidade, quantidade, condições de troca, cobertores, travesseiros e toalhas."
    instructions: "Informe se o imóvel fornece lençóis, fronhas, cobertores, edredons, travesseiros e toalhas de banho/rosto/piscina, bem como quantidades e políticas de troca."
    aliases:
      - "Enxoval de cama e banho"
      - "Roupas de cama e banho"
    field_type: "text"
    sensitive: false
    required: false
    max_length: 1500
    enabled: true
    allow_auto_fill: true

  - field_key: "wifi_and_electronics"
    stays_label: "Wi-fi e dispositivos eletrônicos"
    description: "rede, velocidade, orientações de uso e dispositivos eletrônicos. Dados sensíveis devem ser tratados com proteção."
    instructions: "Informe nome da rede Wi-Fi (SSID), senha (se constar na fonte, marcando sensitive=true), velocidade contratada, Smart TV, streaming, som e voltagem das tomadas."
    aliases:
      - "Wi-Fi e dispositivos eletronicos"
      - "Wifi e dispositivos eletrônicos"
    field_type: "text"
    sensitive: true
    required: false
    max_length: 1500
    enabled: true
    allow_auto_fill: true

  - field_key: "meal_plan"
    stays_label: "Plano de alimentação"
    description: "informar se existe plano de alimentação e suas regras."
    instructions: "Esclareça se café da manhã ou refeições estão inclusos ou disponíveis à parte, horários e regras, ou se a locação é exclusivamente sem alimentação."
