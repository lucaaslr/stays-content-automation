    enabled: true
    allow_auto_fill: true

  - field_key: "emergency_info"
    stays_label: "Em caso de emergência"
    description: "instruções de suporte e telefones locais verificados de hospital, unidade de saúde, polícia, bombeiros, Defesa Civil e clínica veterinária."
    instructions: "Inclua somente telefones e orientações de emergência presentes e verificados na fonte. NUNCA invente telefones de hospitais ou clínicas locais."
