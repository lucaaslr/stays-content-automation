[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stays-content-automation"
version = "1.0.0"
description = "Automação segura com Playwright e Claude API para preenchimento dos campos personalizados de imóveis no Stays.net"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Engenharia de Automação", email = "automacao@example.com" }
]
dependencies = [
  "anthropic>=0.39.0",
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.0",
  "playwright>=1.48.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.1",
  "rich>=13.7.0",
  "trafilatura>=1.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
stays-automation = "stays_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
